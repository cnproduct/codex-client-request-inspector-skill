name: Cross-platform Skill CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Validate Skill structure
        run: python scripts/validate_skill.py

      - name: Scan distributable files for sensitive data
        run: python scripts/scan_sensitive.py

      - name: Test credential filtering and simulated installations
        run: python -m unittest discover -s tests -v

      - name: Compile Python entry points
        run: python -m py_compile scripts/inspect_codex.py scripts/validate_skill.py scripts/scan_sensitive.py
