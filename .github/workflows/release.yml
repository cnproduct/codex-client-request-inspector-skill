name: Publish Skill package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release source
        run: |
          python scripts/validate_skill.py
          python scripts/scan_sensitive.py
          python -m unittest discover -s tests -v

      - name: Build platform-neutral archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=codex-client-request-inspector/ -o "dist/codex-client-request-inspector-${RELEASE_TAG}.zip" HEAD
          git archive --format=tar.gz --prefix=codex-client-request-inspector/ -o "dist/codex-client-request-inspector-${RELEASE_TAG}.tar.gz" HEAD
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${RELEASE_TAG}"
          dist/codex-client-request-inspector-${RELEASE_TAG}.zip
          dist/codex-client-request-inspector-${RELEASE_TAG}.tar.gz
          dist/SHA256SUMS.txt
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Codex Client Request Inspector ${RELEASE_TAG}"
